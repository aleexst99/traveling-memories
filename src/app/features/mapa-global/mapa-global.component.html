<section class="mapa-global">
  <h2>🌍 Mapa Global de Viajes</h2>

  <div class="filtros">
    <label>Usuario:</label>
    <select [value]="filtroUsuario()" (change)="filtroUsuario.set($any($event.target).value); onFilterChange()">
      <option value="Todos">Todos</option>
      @for (u of users(); track u.id) {
        <option [value]="u.id">{{ u.name }}</option>
      }
    </select>

    <label>Continente:</label>
    <select [value]="filtroContinente()"
            (change)="filtroContinente.set($any($event.target).value); onFilterChange()">
      @for (c of continentes; track c) {
        <option [value]="c">{{ c }}</option>
      }
    </select>
  </div>

  <div id="map"></div>
</section>
