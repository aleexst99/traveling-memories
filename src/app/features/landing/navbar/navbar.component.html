<header class="navbar">
  <div class="navbar-content">

    <img src="assets/logo.png" alt="Logo" class="logo" routerLink="/" style="cursor:pointer" />

    <!-- Hamburger (solo visible en móvil) -->
    <button class="hamburger" (click)="toggleMenu()" [class.open]="menuAbierto()" aria-label="Menú">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Menú -->
    <nav class="menu" [class.open]="menuAbierto()">
      <a routerLink="/" (click)="cerrarMenu()">Inicio</a>
      <a routerLink="/mapa-global" (click)="cerrarMenu()">Mapa Global</a>

      <button class="btn-theme" (click)="theme.toggle()" [title]="theme.isDark() ? 'Modo claro' : 'Modo oscuro'">
        {{ theme.isDark() ? '☀️' : '🌙' }}
      </button>

      @if (auth.isLoggedIn()) {
        <span class="user-badge">👤 {{ auth.currentUser()?.username }}</span>
        <button class="btn-logout" (click)="logout()">Salir</button>
      } @else {
        <a routerLink="/login" class="btn-login" (click)="cerrarMenu()">Acceder</a>
      }
    </nav>

  </div>
</header>
