<article
  class="viaje-card"
  [class.wishlist]="wishlist()"
  (click)="onCardClick()"
  role="button"
  tabindex="0"
  (keydown.enter)="onCardClick()"
  (keydown.space)="onCardClick()">

  <div class="card-image">
    <img [src]="viaje().image" [alt]="viaje().title" />
    @if (numEntradas() > 0) {
      <span class="entradas-badge">{{ numEntradas() }} {{ numEntradas() === 1 ? 'entrada' : 'entradas' }}</span>
    }
  </div>

  <div class="info">
    <h3>{{ viaje().title }}</h3>

    @if (ultimaFecha()) {
      <p class="ultima-entrada">
        <span class="dot"></span>
        {{ ultimaFecha() | date:'MMM yyyy' }}
      </p>
    } @else if (viaje().description) {
      <p>{{ viaje().description }}</p>
    }

    <small>{{ viaje().continent }}</small>
  </div>

</article>
