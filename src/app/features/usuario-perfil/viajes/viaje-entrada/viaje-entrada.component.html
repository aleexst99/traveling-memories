<div class="entrada-container">
  <button class="btn-back" (click)="cancelar()">← Volver al viaje</button>

  <h2>{{ esEdicion ? 'Editar entrada' : 'Nueva entrada' }}</h2>

  <form [formGroup]="form" (ngSubmit)="guardar()" class="entrada-form">

    <label>Título *</label>
    <input type="text" formControlName="title" placeholder="Ej: Amsterdam" />

    <div class="row">
      <div class="field">
        <label>Fecha</label>
        <input type="date" formControlName="fecha" />
      </div>
      <div class="field">
        <label>Días</label>
        <input type="number" formControlName="dias" placeholder="4" min="1" />
      </div>
    </div>

    <label>Descripción</label>
    <textarea rows="4" formControlName="description" placeholder="¿Qué hiciste? ¿Qué destacarías?"></textarea>

    <label>Imagen</label>
    <div class="upload-area">
      @if (previewImagen()) {
        <img [src]="previewImagen()!" class="preview-img" alt="Preview" />
      }
      <label class="upload-btn" [class.disabled]="subiendoImagen()">
        @if (subiendoImagen()) {
          <span class="spinner"></span> Subiendo...
        } @else if (previewImagen()) {
          Cambiar imagen
        } @else {
          Seleccionar imagen
        }
        <input type="file" accept="image/*" (change)="onImageSelected($event)" [disabled]="subiendoImagen()" hidden />
      </label>
    </div>

    <div class="acciones">
      <button type="button" class="btn-cancel" (click)="cancelar()">Cancelar</button>
      <button type="submit" class="btn-primary" [disabled]="form.invalid || subiendoImagen()">Guardar entrada</button>
    </div>

  </form>
</div>
