<section class="perfil-container">
  @if (user(); as u) {
    <!-- 🧑 Header -->
    <app-perfil-header [user]="u" />

    <!-- ⚙️ Acciones -->
    <div class="perfil-actions">
      @if (auth.canEditUser(u.id)) {
        <button class="btn-primary" (click)="abrirModal()">➕ Añadir viaje</button>
      }

      <select (change)="filtrarPorContinente($any($event.target).value)">
        @for (c of continentes(); track c) {
          <option [selected]="c === filtroContinente()" [value]="c">{{ c }}</option>
        }
      </select>
    </div>

    <!-- 📊 Dashboard -->
    <div class="perfil-stats">
      <p><strong>{{ viajesRealizados() }}</strong> viajes realizados</p>
      <p><strong>{{ viajesWishlist() }}</strong> en wishlist</p>
      <p><strong>{{ porcentajeContinentes() }}%</strong> continentes visitados</p>
    </div>

    <!-- 🗺️ Mapa -->
    <app-perfil-mapa [user]="u" />

    <!-- ✈️ Lista de viajes -->
    <app-viajes-lista [userId]="u.id" [viajes]="viajesFiltrados()" [wishlist]="u.wishlist" />
  } @else {
    <div class="loading">
      <p>Cargando usuario...</p>
    </div>
  }
</section>

<app-viaje-form
*ngIf="mostrarModal"
[idUser]="user()?.id ?? 0"
  (guardar)="onViajeGuardado($event)"
  (cerrar)="cerrarModal()"
  />
