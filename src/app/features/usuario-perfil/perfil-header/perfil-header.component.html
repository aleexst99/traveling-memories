<section class="perfil-header" [class.dark]="modoOscuro()">
  <div class="avatar">
    <img [src]="user().photo" [alt]="user().name" />
  </div>

  <div class="info">
    <h1>{{ displayName() }}</h1>
    <p>{{ user().bio }}</p>

    @if (user().social.github || user().social.linkedin) {
      <div class="social">
        @if (user().social.github) {
          <a [href]="user().social.github" target="_blank" aria-label="GitHub">
            <i class="fa-brands fa-github"></i>
          </a>
        }
        @if (user().social.linkedin) {
          <a [href]="user().social.linkedin" target="_blank" aria-label="LinkedIn">
            <i class="fa-brands fa-linkedin"></i>
          </a>
        }
      </div>
    }

    <button class="modo" (click)="toggleModoOscuro()">
      {{ modoOscuro() ? '☀️ Modo claro' : '🌙 Modo oscuro' }}
    </button>
  </div>
</section>
