name: CI — Dev (Staging)

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: traveling-memories/package-lock.json

      - name: Install dependencies
        working-directory: traveling-memories
        run: npm ci

      - name: Create environment file (dev)
        working-directory: traveling-memories
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_URL: ${{ secrets.API_URL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
        run: |
          cat > src/environments/environment.ts << EOF
          export const environment = {
            production: false,
            apiUrl: '${API_URL}',
            apiKey: '${API_KEY}',
            cloudinaryCloudName: '${CLOUDINARY_CLOUD_NAME}',
            cloudinaryUploadPreset: '${CLOUDINARY_UPLOAD_PRESET}',
          };
          EOF

      - name: Run tests
        working-directory: traveling-memories
        run: npm test -- --watch=false --browsers=ChromeHeadlessCI --no-progress
        env:
          CHROME_FLAGS: "--no-sandbox --disable-gpu"

      - name: Build (dev)
        working-directory: traveling-memories
        run: npm run build -- --configuration development

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-build
          path: traveling-memories/dist/travel-blog/
          retention-days: 7
